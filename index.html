<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DOCKSTAR</title>
  <meta name="description" content="DOCKSTAR — a 1980s docking shooter. Stack your ship from fighter, cruiser and reactor modules, fly whatever survives, and break the swarm.">
  <style>
/* DOCKSTAR - manga paper page around an arcade screen (adaptive, fullscreen).
   Family: ink black / pure white / vermillion accent + colored enemy families. */
:root {
  --paper: #f6f1e6;
  --ink: #0a0a0a;
  --red: #e0301e;
  --gray: #6f6f6f;
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace;
  display: flex;
  flex-direction: column;
  -webkit-user-select: none;
  user-select: none;
}
header {
  width: 100%;
  max-width: 980px;
  margin: 0 auto;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px 6px;
  border-bottom: 2px solid var(--ink);
  flex: none;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}
.brand .mark {
  display: inline-block;
  width: 10px; height: 10px;
  background: var(--red);
  transform: translateY(1px);
}
.brand h1 {
  margin: 0;
  font-size: 20px;
  letter-spacing: 3px;
  font-weight: 900;
}
.brand .tag {
  font-size: 10px;
  color: var(--gray);
  letter-spacing: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topctl { display: flex; gap: 6px; align-items: center; flex: none; }
#langs { display: flex; }
button {
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 1px;
  background: transparent;
  border: 2px solid var(--ink);
  color: var(--ink);
  padding: 3px 7px;
  cursor: pointer;
}
button:hover { background: var(--ink); color: var(--paper); }
#langs button { border-right-width: 0; padding: 3px 8px; }
#langs button:last-child { border-right-width: 2px; }
#langs button.on { background: var(--ink); color: var(--paper); }
#btn-sound.off, #btn-fs.off { color: var(--gray); border-color: var(--gray); }
#btn-sound.off:hover, #btn-fs.off:hover { background: var(--gray); color: var(--paper); }
#btn-fs { border-color: var(--red); color: var(--red); }
#btn-fs:hover { background: var(--red); color: var(--paper); }

main {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}
.screen {
  position: relative;
  border: 3px solid var(--ink);
  box-shadow: 6px 6px 0 rgba(10, 10, 10, 0.85);
  background: #050505;
  line-height: 0;
}
.screen::after {
  content: "";
  position: absolute;
  top: -3px; right: -3px;
  width: 22px; height: 22px;
  background: var(--red);
  clip-path: polygon(100% 0, 100% 100%, 0 0);
  pointer-events: none;
}
canvas#game {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  cursor: crosshair;
}
footer {
  flex: none;
  width: 100%;
  max-width: 980px;
  margin: 0 auto;
  padding: 6px 14px 10px;
  border-top: 2px solid var(--ink);
  font-size: 10px;
  color: var(--gray);
  letter-spacing: 0.5px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* fullscreen: the game frame fills the screen, everything else vanishes */
.screen:fullscreen {
  width: 100vw !important;
  height: 100vh !important;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  box-shadow: none;
  background: #000;
}
.screen:fullscreen::after { display: none; }
.screen:-webkit-full-screen { width: 100vw !important; height: 100vh !important; border: none; box-shadow: none; background: #000; display: flex; align-items: center; justify-content: center; }
.screen:-webkit-full-screen::after { display: none; }

/* fallback "maximized" mode when fullscreen is unavailable (e.g. sandboxed iframe) */
body.maxed header, body.maxed footer { display: none; }
body.maxed main { padding: 0; }
body.maxed .screen { border-width: 2px; }

@media (max-width: 700px), (max-height: 640px) {
  header { padding: 6px 10px 4px; }
  .brand h1 { font-size: 16px; }
  .brand .tag { display: none; }
  footer { padding: 4px 10px 6px; }
}
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark"></span>
      <h1>DOCKSTAR</h1>
      <span class="tag" id="tagline"></span>
    </div>
    <div class="topctl">
      <div id="langs" role="group" aria-label="Language">
        <button data-lang="en" type="button">EN</button><button data-lang="fr" type="button">FR</button><button data-lang="es" type="button">ES</button>
      </div>
      <button id="btn-sound" type="button">SOUND ON</button>
      <button id="btn-fs" type="button">FULLSCREEN</button>
    </div>
  </header>
  <main id="main">
    <div class="screen" id="screenwrap">
      <canvas id="game" width="240" height="320" aria-label="DOCKSTAR game screen"></canvas>
    </div>
  </main>
  <footer><span id="foot"></span></footer>

    return st;
  }

  function banner(st, key, arg, dur) { st.banner = { key: key, arg: arg, t: dur || 100, dur: dur || 100 }; }
  function ev(st, type, data) { st.events.push({ type: type, data: data || null }); }
  function pop(st, x, y, text) { st.pops.push({ x: x, y: y, text: text, life: 46 }); }
  function burst(st, x, y, n, big, col) {
    col = col || 'R';
    var dark = col.toLowerCase();
    for (var i = 0; i < n; i++) {
      var a = st.rng() * Math.PI * 2, sp = (big ? 1.6 : 0.9) + st.rng() * (big ? 2.4 : 1.6);
      var cr = st.rng();
      st.parts.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 20 + st.rng() * 22 | 0,
        c: cr < 0.5 ? col : (cr < 0.78 ? 'W' : dark), sz: st.rng() < 0.3 ? 3 : 2
      });
    }
    st.parts.push({ x: x, y: y, vx: 0, vy: 0, life: 7, c: 'W', sz: big ? 22 : 12, flashP: true });
  }
  function addScore(st, n) {
    st.score += n;
    if (st.score > st.hi) { st.hi = st.score; if (st.score > st.hi0) st.newRecord = true; }
    if (st.score >= st.nextExtra) {
      st.lives++; st.nextExtra += 50000;
      ev(st, 'oneup'); pop(st, st.player.x, st.player.y - 30, '1UP!');
    }
  }
  function eShot(st, x, y, vx, vy) { st.ebullets.push({ x: x, y: y, vx: vx, vy: vy }); }
  function aimShot(st, x, y, sp) {
    var dx = st.player.x - x, dy = (st.player.y - 14) - y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    eShot(st, x, y, dx / d * sp, dy / d * sp);
  }

  // -------------------------------------------------------------- spawning
  function spawnEnemy(st, g) {
    var t = g.type, r = st.rng;
    var e = { type: t, t: 0, hp: ENEMY[t].hp, fireT: 60 + r() * 200 | 0 };
    if (t === 'drone') {
      e.x = g.col ? st.W * 0.12 + (g.spawned % 2) * 10 + r() * st.W * 0.66 : st.W * 0.08 + r() * st.W * 0.84;
      e.y = -12; e.baseX = e.x; e.phase = r() * 6.28;
    } else if (t === 'moth') {
      var side = g.side || 1;
      e.x = side > 0 ? -10 : st.W + 10; e.dir = side;
      e.enterY = st.H * 0.13 + r() * st.H * 0.28; e.y = e.enterY; e.phase = r() * 6.28;
    } else if (t === 'dart') {
      e.x = 24 + r() * (st.W - 48); e.y = -12; e.state = 'aim'; e.aimT = 60 + r() * 30 | 0;
    } else if (t === 'spitter') {
      e.x = st.W * 0.1 + r() * st.W * 0.8; e.y = -12; e.targetY = st.H * 0.14 + r() * st.H * 0.2;
      e.volleys = st.stage === 1 ? 3 : (4 + (st.stage >= 5 ? 1 : 0)); e.cd = 80; e.phase = r() * 6.28;
      e.hp = ENEMY.spitter.hp + (st.stage >= 5 ? 1 : 0);
    } else if (t === 'splitter') {
      e.x = st.W * 0.1 + r() * st.W * 0.8; e.y = -16; e.phase = r() * 6.28;
      e.hp = Math.min(6, ENEMY.splitter.hp + Math.floor(st.stage / 4));
    }
    st.enemies.push(e);
    ev(st, 'spawn');
  }

  // --------------------------------------------------------------- updates
  function updatePlayer(st, input) {
    var p = st.player;
    if (!p.alive) return;
    var s = statsFor(p.stack);
    var spd = s.spd;
    var dx = 0, dy = 0;
    if (input.touch) {
      // steer toward the touch target at max speed
      var tx = clamp(input.tx, 12, st.W - 12), ty = clamp(input.ty - 24, st.H * 0.34, st.H - 14);
      var ddx = tx - p.x, ddy = ty - p.y;
      var d = Math.sqrt(ddx * ddx + ddy * ddy);
      if (d > 1) { dx = ddx / d * spd; dy = ddy / d * spd; }
    } else {
      if (input.left) dx -= spd;
      if (input.right) dx += spd;
      if (input.up) dy -= spd;
      if (input.down) dy += spd;
    }
    p.x = clamp(p.x + dx, 12, st.W - 12);
    p.y = clamp(p.y + dy, st.H * 0.34 + s.h, st.H - 12);
    if (p.cool > 0) p.cool--;
    if (p.invuln > 0) p.invuln--;
    if ((input.fire || input.touch) && p.cool === 0) {
      p.cool = s.cd;
      for (var i = 0; i < s.guns.length; i++) {
        var g = s.guns[i];
        st.pbullets.push({
          x: p.x + g.dx, y: p.y - s.h + (g.heavy ? 2 : 0),
          vx: g.vx, vy: -4, dmg: g.heavy ? 2 : 1, heavy: g.heavy
        });
      }
      ev(st, s.guns[0].heavy && s.guns.length === 1 ? 'heavy' : 'shot');
    }
  }

  function updateEnemies(st) {
    var bs = bulletSpeed(st.stage), p = st.player;
    for (var i = st.enemies.length - 1; i >= 0; i--) {
      var e = st.enemies[i];
      e.t++;
      if (e.type === 'drone') {
        e.y += 0.42;
        e.x = e.baseX + Math.sin(e.t * 0.04 + e.phase) * 18;
        if (e.t > 60 && e.y < st.H * 0.66 && st.rng() < Math.min(0.004, 0.0012 + st.stage * 0.00035)) aimShot(st, e.x, e.y + 4, bs * 0.9);
      } else if (e.type === 'moth') {
        e.x += e.dir * 0.9;
        e.y = e.enterY + Math.sin(e.x * 0.035 + e.phase) * 18;
        if (Math.abs(e.x - p.x) < 14 && st.rng() < 0.02 + st.stage * 0.004) aimShot(st, e.x, e.y, bs);
      } else if (e.type === 'dart') {
        if (e.state === 'aim') {
          e.y += 0.25; e.aimT--;
          if (e.aimT <= 0) {
            var dx = p.x - e.x, dy = p.y - e.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
            e.vx = dx / d * 2.5; e.vy = dy / d * 2.5; e.state = 'dive';
          }
        } else { e.x += e.vx; e.y += e.vy; }
      } else if (e.type === 'spitter') {
        if (e.y < e.targetY) e.y += 0.7;
        else {
          e.x += Math.sin(e.t * 0.02 + e.phase) * 0.4;
          if (--e.cd <= 0) {
            e.cd = Math.max(70, 115 - st.stage * 5);
            var n = st.stage >= 4 ? 5 : 3, k;
            for (k = 0; k < n; k++) {
              var ang = Math.atan2((p.y - 14) - e.y, p.x - e.x) + (k - (n - 1) / 2) * 0.28;
              eShot(st, e.x, e.y + 4, Math.cos(ang) * bs, Math.sin(ang) * bs);
            }
            e.volleys--;
            if (e.volleys <= 0) e.leaving = true;
          }
        }
        if (e.leaving) e.y += 1.1;
      } else if (e.type === 'splitter') {
        e.y += 0.3;
        e.x += Math.sin(e.t * 0.025 + e.phase) * 0.5;
      } else if (e.type === 'mini') {
        e.x += e.vx; e.y += e.vy;
        e.vy = Math.min(e.vy + 0.012, 1.4);
        if (p.alive && e.x < p.x) e.vx = Math.min(e.vx + 0.008, 1.5);
        else e.vx = Math.max(e.vx - 0.008, -1.5);
      }
      // off screen
      if (e.y > st.H + 20 || e.y < -40 || e.x < -30 || e.x > st.W + 30) {
        st.enemies.splice(i, 1);
        continue;
      }
      // ram player
      if (p.alive && p.invuln <= 0) {
        var s = statsFor(p.stack);
        if (Math.abs(e.x - p.x) < (ENEMY[e.type].w + s.w) / 2 &&
            e.y + ENEMY[e.type].h > p.y - s.h && e.y < p.y) {
          hitPlayer(st);
          if (e.type !== 'splitter') { st.enemies.splice(i, 1); }
          else { e.hp = 0; killEnemy(st, i); }
          continue;
        }
      }
    }
  }

  function killEnemy(st, i) {
    var e = st.enemies[i], def = ENEMY[e.type];
    addScore(st, def.score);
    pop(st, e.x, e.y, '+' + def.score);
    burst(st, e.x, e.y + def.h / 2, e.type === 'splitter' ? 14 : 8, e.type === 'splitter', def.col);
    ev(st, 'explode');
    st.shake = Math.max(st.shake, e.type === 'splitter' ? 5 : 2);
    if (e.type === 'splitter') {
      for (var k = 0; k < 2; k++) {
        st.enemies.push({
          type: 'mini', t: 0, hp: ENEMY.mini.hp, x: e.x + (k ? 8 : -8), y: e.y,
          vx: k ? 1.3 : -1.3, vy: 0.5, fireT: 9999
        });
      }
    }
    st.enemies.splice(i, 1);
  }

  function hitPlayer(st) {
    var p = st.player;
    if (!p.alive || p.invuln > 0) return;
    var s = statsFor(p.stack);
    var lost = p.stack.shift();
    ev(st, 'playerhit');
    burst(st, p.x, p.y - s.h + 5, 16, true);
    st.shake = 8; st.flash = 4;
    st.ebullets.length = 0; // mercy clear
    if (p.stack.length === 0) {
      p.alive = false;
      st.phaseAfterDeath = st.phase;
      st.lives--;
      ev(st, 'modulelost', { last: true });
      st.phase = st.lives < 0 ? 'gameover' : 'dead';
      st.phaseT = 0;
      if (st.lives < 0) { ev(st, 'gameover'); if (st.score >= st.hi) st.hi = st.score; }
      else banner(st, 'ready', null, 80);
    } else {
      p.invuln = 100;
      ev(st, 'modulelost', { module: lost });
      banner(st, 'moduleLost', null, 70);
    }
  }

  function updatePlan(st) {
    var plan = st.plan;
    if (plan.gi >= plan.groups.length) return;
    var g = plan.groups[plan.gi];
    if (g.spawned < g.count) {
      if (--plan.t <= 0) {
        if (st.enemies.length < 15) {
          spawnEnemy(st, g);
          g.spawned++;
          plan.t = g.interval;
        } else plan.t = 10;
      }
    } else if (st.enemies.length === 0) {
      if (plan.restT === 0) plan.restT = 46;
      else if (--plan.restT <= 0) {
        plan.restT = 0;
        plan.gi++;
        if (plan.gi >= plan.groups.length) {
          // waves done -> boss
          st.phase = 'bossintro'; st.phaseT = 0;
          ev(st, 'warning');
        }
      }
    }
  }

  function firstMissingModule(stack) {
    for (var i = 0; i < ORDER.length; i++) if (stack.indexOf(ORDER[i]) < 0) return ORDER[i];
    return null;
  }

  function startDocking(st) {
    var kind = firstMissingModule(st.player.stack);
    if (!kind) { nextStage(st); return; }
    st.module = {
      kind: kind,
      x: st.W * 0.15 + st.rng() * st.W * 0.7, y: -20,
      baseX: 0, phase: st.rng() * 6.28, t: 0
    };
    st.module.baseX = st.module.x;
    st.phase = 'docking'; st.phaseT = 0;
  }

  function updateDocking(st) {
    var m = st.module, p = st.player;
    if (!m) {
      // dock just happened or module missed: pause, then next stage
      if (st.restT > 0) {
        st.restT--;
        if (st.restT === 0) nextStage(st);
      } else nextStage(st);
      return;
    }
    m.t++;
    m.y += 0.5;
    m.x = m.baseX + Math.sin(m.t * 0.03 + m.phase) * 14;
    var s = statsFor(p.stack);
    var mw = MOD[m.kind].w, mh = MOD[m.kind].h;
    if (p.alive &&
        Math.abs(m.x - p.x) < (mw + s.w) / 2 + 2 &&
        m.y + mh > p.y - s.h - 4 && m.y < p.y + 4) {
      // dock!
      var align = Math.abs(m.x - p.x);
      var bonus = align <= 3 ? 1000 : (align <= 8 ? 700 : 500);
      var perfect = align <= 3;
      p.stack.push(m.kind);
      p.stack.sort(function (a, b) { return ORDER.indexOf(a) - ORDER.indexOf(b); });
      addScore(st, bonus);
      pop(st, p.x, p.y - s.h - 14, '+' + bonus);
      banner(st, perfect ? 'perfectDock' : 'docked', null, 80);
      ev(st, perfect ? 'dockperfect' : 'dock');
      burst(st, m.x, m.y + mh / 2, 12, false);
      st.module = null;
      st.phaseT = 0;
      st.restT = 60; // short pause then next stage
      return;
    }
    if (m.y > st.H + 16) {
      st.module = null;
      banner(st, 'dockMissed', null, 70);
      ev(st, 'dockfail');
      st.restT = 40;
    }
    // shared exit path
    if (!st.module && st.restT > 0) {
      st.restT--;
      if (st.restT === 0) nextStage(st);
    } else if (!st.module && st.restT === 0) {
      nextStage(st);
    }
  }

  function nextStage(st) {
    st.stage++;
    st.plan = { groups: composeStage(st.stage, st.rng), gi: 0, t: 30, restT: 0 };
    st.phase = 'waves'; st.phaseT = 0;
    banner(st, 'stage', st.stage, 110);
    st.module = null;
  }

  function bossShootFan(st, b) {
    var n = 3 + Math.min(Math.floor(st.stage / 2), 3);
    var bs = bulletSpeed(st.stage);
    var base = Math.atan2((st.player.y - 14) - b.y, st.player.x - b.x);
    for (var k = 0; k < n; k++) {
      var a = base + (k - (n - 1) / 2) * 0.22;
      eShot(st, b.x + Math.cos(a) * 10, b.y + 6, Math.cos(a) * bs * 1.1, Math.sin(a) * bs * 1.1);
    }
  }
  function bossShootWall(st, b) {
    var bs = bulletSpeed(st.stage);
    var gap = Math.floor(st.rng() * (b.w - 30)) - (b.w / 2 - 15);
    var gx = b.x + gap;
    for (var x = -b.w / 2 + 4; x <= b.w / 2 - 4; x += 9) {
      var px = b.x + x;
      if (Math.abs(px - gx) < 13) continue;
      eShot(st, px, b.y + b.h / 2, 0, bs * 0.8);
    }
  }
  function bossShootSpiral(st, b) {
    var bs = bulletSpeed(st.stage), n = 10;
    for (var k = 0; k < n; k++) {
      var a = b.spiralA + k * (Math.PI * 2 / n);
      eShot(st, b.x, b.y, Math.cos(a) * bs * 0.9, Math.sin(a) * bs * 0.9);
    }
    b.spiralA += 0.45;
  }

  function updateBoss(st) {
    var b = st.boss;
    if (!b) return;
    b.t++;
    if (b.flash > 0) b.flash--;
    if (b.dead) {
      b.deathT--;
      if (b.deathT % 7 === 0) {
        burst(st, b.x + (st.rng() - 0.5) * b.w, b.y + (st.rng() - 0.5) * b.h, 12, true);
        ev(st, 'explode');
        st.shake = 7;
      }
      if (b.deathT <= 0) {
        st.boss = null;
        var bonus = 1000 + 500 * st.stage;
        addScore(st, bonus);
        pop(st, st.W / 2, st.H * 0.19, '+' + bonus);
        st.ebullets.length = 0;
        banner(st, 'clear', st.stage, 150);
        ev(st, 'stageclear');
        st.clearT = 150;
        st.bonusLeft = 300 + 200 * st.stage;
        st.phase = 'clear'; st.phaseT = 0;
      }
      return;
    }
    var speedMul = (b.hp < b.maxHp * 0.35 ? 1.5 : 1);
    var cdMul = (b.hp < b.maxHp * 0.35 ? (st.stage >= 3 ? 0.75 : 0.6) : 1);
    if (b.tier === 2) {
      // serpent: head leads a slow slither, segments follow by arc length
      var hx = st.W / 2 + Math.sin(b.t * 0.045 * speedMul) * (st.W * 0.35);
      var hy = st.H * 0.175 + Math.sin(b.t * 0.021) * (st.H * 0.08);
      if (!b.trailD) b.trailD = 0;
      b.trailD += Math.sqrt((hx - b.x) * (hx - b.x) + (hy - b.y) * (hy - b.y));
      b.trail.unshift({ x: hx, y: hy, d: b.trailD });
      if (b.trail.length > 700) b.trail.pop();
      b.x = hx; b.y = hy;
      for (var si = 0; si < b.segs.length; si++) {
        var want = b.trailD - (si + 1) * 9;
        var pt = b.trail[b.trail.length - 1];
        for (var ti2 = 0; ti2 < b.trail.length; ti2++) {
          if (b.trail[ti2].d < want) break; // reached points older than wanted
          pt = b.trail[ti2];
        }
        b.segs[si].x = pt.x; b.segs[si].y = pt.y;
      }
      if (--b.coolFan <= 0) {
        b.coolFan = Math.max(50, (100 - st.stage * 4)) * cdMul;
        aimShot(st, b.x, b.y + 5, bulletSpeed(st.stage) * 1.15);
        if (st.stage >= 5) {
          var mid = b.segs[Math.floor(b.segs.length / 2)];
          if (mid) aimShot(st, mid.x, mid.y + 5, bulletSpeed(st.stage));
        }
      }
    } else {
      // hull bosses slide in then sway
      var hoverY = st.H * 0.163;
      if (b.y < hoverY) b.y += 0.6;
      else {
        var rx = (st.W - b.w) / 2 - 4;
        b.x = st.W / 2 + Math.sin(b.t * (0.012 + 0.0018 * st.stage) * speedMul) * rx;
        b.y = hoverY + Math.sin(b.t * 0.021) * 5;
      }
      if (b.tier === 3 && b.turrets) {
        for (var ti = 0; ti < b.turrets.length; ti++) {
          var tu = b.turrets[ti];
          tu.x = b.x + tu.dx * b.w; tu.y = b.y + b.h * 0.55;
          if (tu.hp > 0 && --tu.cd <= 0) {
            tu.cd = Math.max(46, 80 - st.stage * 3) * cdMul;
            aimShot(st, tu.x, tu.y + 4, bulletSpeed(st.stage) * 1.2);
          }
        }
      }
      if (--b.coolFan <= 0) {
        b.coolFan = Math.max(55, (95 - st.stage * 4)) * cdMul;
        bossShootFan(st, b);
      }
      if (st.stage >= 2 && --b.coolWall <= 0) {
        b.coolWall = Math.max(90, (150 - st.stage * 5)) * cdMul;
        bossShootWall(st, b);
      }
      if (st.stage >= 3 && --b.coolSpiral <= 0) {
        b.coolSpiral = Math.max(120, (190 - st.stage * 6)) * cdMul;
        bossShootSpiral(st, b);
        bossShootSpiral(st, b); // double burst
      }
    }
  }

  function damageBoss(st, dmg) {
    var b = st.boss;
    if (!b || b.dead) return;
    b.hp -= dmg;
    b.flash = 3;
    ev(st, 'bosshit');
    if (b.hp <= 0) {
      b.dead = true; b.deathT = 56;
      ev(st, 'bigexplode');
      st.shake = 10;
      // the swarm dies with its boss
      for (var ei = st.enemies.length - 1; ei >= 0; ei--) {
        burst(st, st.enemies[ei].x, st.enemies[ei].y, 6, false);
        st.enemies.splice(ei, 1);
      }
      st.ebullets.length = 0;
    }
  }

  function updateBullets(st) {
    var p = st.player, i, j;
    // player bullets
    for (i = st.pbullets.length - 1; i >= 0; i--) {
      var pb = st.pbullets[i];
      pb.x += pb.vx; pb.y += pb.vy;
      if (pb.y < -10 || pb.x < -10 || pb.x > st.W + 10) { st.pbullets.splice(i, 1); continue; }
      var consumed = false;
      // vs enemies
      for (j = st.enemies.length - 1; j >= 0; j--) {
        var e = st.enemies[j], def = ENEMY[e.type];
        if (Math.abs(pb.x - e.x) < def.w / 2 + 1 && pb.y < e.y + def.h && pb.y + 6 > e.y) {
          e.hp -= pb.dmg;
          consumed = true;
          if (e.hp <= 0) killEnemy(st, j);
          else { ev(st, 'hit'); st.parts.push({ x: pb.x, y: pb.y, vx: 0, vy: -0.5, life: 6, c: 'W', sz: 3, flashP: true }); }
          break;
        }
      }
      if (consumed) { st.pbullets.splice(i, 1); continue; }
      // vs boss
      var b = st.boss;
      if (b && !b.dead) {
        if (b.tier === 2) {
          for (j = 0; j < b.segs.length; j++) {
            var sg = b.segs[j];
            if (sg.hp > 0 && Math.abs(pb.x - sg.x) < 8 && pb.y < sg.y + 8 && pb.y + 6 > sg.y - 8) {
              sg.hp -= pb.dmg; b.hp -= pb.dmg; b.flash = 3;
              consumed = true;
              if (sg.hp <= 0) {
                burst(st, sg.x, sg.y, 10, true);
                ev(st, 'explode');
                addScore(st, 120); pop(st, sg.x, sg.y, '+120');
              }
              if (b.hp <= 0) { b.dead = true; b.deathT = 56; ev(st, 'bigexplode'); st.shake = 10; }
              break;
            }
          }
        } else {
          // turrets first
          if (b.turrets) {
            for (j = 0; j < b.turrets.length; j++) {
              var tu = b.turrets[j];
              if (tu.hp > 0 && Math.abs(pb.x - tu.x) < 6 && pb.y < tu.y + 5 && pb.y + 6 > tu.y - 5) {
                tu.hp -= pb.dmg; consumed = true; b.flash = 2;
                if (tu.hp <= 0) {
                  burst(st, tu.x, tu.y, 10, true);
                  addScore(st, 300); pop(st, tu.x, tu.y, '+300');
                  ev(st, 'explode');
                }
                break;
              }
            }
          }
          if (!consumed && Math.abs(pb.x - b.x) < b.w / 2 && pb.y < b.y + b.h / 2 && pb.y + 6 > b.y - b.h / 2) {
            damageBoss(st, pb.dmg);
            consumed = true;
          }
        }
        if (consumed) { st.pbullets.splice(i, 1); continue; }
      }
    }
    // enemy bullets
    if (p.alive) {
      var s = statsFor(p.stack);

    text(pad6(st.score), 28, 8, COL.W);
    var hiX = Math.round(LW / 2) - 26;
    text('HI', hiX, 3, COL.R);
    text(pad6(st.hi), hiX + 20, 8, st.newRecord ? COL.R : COL.W);
    text('ST.' + st.stage, LW - 36, 3, '#35e0e8');
    for (var i = 0; i < Math.min(st.lives, (LW / 6 | 0) - 2); i++) {
      ctx.save();
      ctx.translate(6 + i * 7, LH - 8);
      ctx.scale(0.55, 0.55);
      ctx.drawImage(SPR.canvas.fighter, 0, 0);
      ctx.restore();
    }
    var order = ['F', 'C', 'R'];
    for (i = 0; i < order.length; i++) {
      var has = st.player.stack.indexOf(order[i]) >= 0;
      text(order[i], LW - 26, LH - 24 + i * 7, has ? (order[i] === 'F' ? COL.W : (order[i] === 'C' ? '#35e0e8' : '#ff8c1a')) : COL.D);
    }
  }

  function bannerText(b) {
    switch (b.key) {
      case 'stage': return T('stage') + ' ' + b.arg;
      case 'clear': return T('stageClear');
      case 'warning': return T('warning');
      case 'bossName': return String(b.arg);
      case 'ready': return T('ready');
      case 'moduleLost': return T('moduleLost');
      case 'docked': return T('docked');
      case 'perfectDock': return T('perfectDock');
      case 'dockMissed': return T('dockMissed');
      case 'fullShip': return T('fullShip');
    }
    return '';
  }
  function drawBanner() {
    if (!st.banner || st.banner.t <= 0) return;
    var b = st.banner;
    var s = b.key === 'warning' ? 2 : 1;
    var txt = bannerText(b);
    var y = Math.round(LH * 0.37);
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, y - 6, LW, 14 * s + 8);
    if (b.key === 'warning') {
      if ((frame >> 3) & 1) textC(txt, y, COL.R, 2);
      else textC(txt, y, COL.W, 2);
    } else if (b.key === 'bossName') {
      textC(txt, y, COL.R, 1);
    } else if (b.key === 'clear') {
      textC(txt, y, COL.W, 1);
      if (st.phase === 'clear') textC(T('stageBonus') + ' ' + st.bonusLeft, y + 14, '#45e06e', 1);
    } else {
      textC(txt, y, COL.W, 1);
    }
  }

  function drawDockHint() {
    if (st.phase !== 'docking' || !st.module) return;
    var m = st.module;
    var name = I18N.moduleNames[m.kind];
    var line = T('dockThe') + ' ' + name + '!';
    textC(line, Math.round(LH * 0.41), COL.W);
    if ((frame >> 3) & 1) {
      var ax = Math.max(10, Math.min(LW - 10, m.x));
      var ay = Math.max(34, Math.min(LH * 0.47, m.y - 10));
      text('↓', ax - 2, ay, COL.R, 1);
    }
  }

  // ------------------------------------------------------------- screens
  function drawLogo(y) {
    var s = 3, txt = 'DOCKSTAR';
    var w = txt.length * 6 * s - s;
    var x = Math.round((LW - w) / 2);
    text(txt, x + 2, y + 2, COL.r, s);
    text(txt, x, y, COL.W, s);
    ctx.fillStyle = COL.R;
    ctx.fillRect(x, y + 7 * s + 4, w, 3);
  }

  function drawTitle() {
    drawStars(false);
    text('HI-SCORE', Math.round(LW / 2) - 60, 6, COL.R);
    text(pad6(hiScore), Math.round(LW / 2), 6, COL.W);
    drawLogo(Math.round(LH * 0.125));
    textC(T('tagline'), Math.round(LH * 0.2375), COL.G);
    if ((frame % 60) < 38) textC(T('pressStart'), Math.round(LH * 0.44), COL.W);
    textC(T('howtoBtn'), Math.round(LH * 0.505), COL.D);
    if (touchDevice) textC(T('touchHint'), Math.round(LH * 0.575), COL.D);
    else textC(T('controlsHint'), Math.round(LH * 0.575), COL.D);
    textC(T('fsHint'), Math.round(LH * 0.64), COL.D);
    // parade of foes, one color family each
    var foes = [['drone1', 0.14], ['moth1', 0.38], ['spitter1', 0.62], ['splitter', 0.85]];
    ctx.globalAlpha = 0.85;
    for (var f = 0; f < foes.length; f++) {
      var fx0 = foes[f][0];
      var s3 = SPR.size(fx0);
      SPR.draw(ctx, fx0, LW * foes[f][1] - s3.w / 2 + Math.sin(frame * 0.03 + f) * 5, LH * 0.70);
    }
    ctx.globalAlpha = 1;
    var bob = Math.sin(frame * 0.05) * 3;
    var px2 = LW / 2, py = LH * 0.9 + bob;
    var stack = ['F', 'C', 'R'];
    for (var i = 0; i < stack.length; i++) {
      var m = E.MOD[stack[i]];
      SPR.draw(ctx, m.spr, px2 - m.w / 2, py - m.h);
      py -= m.h;
    }
    SPR.draw(ctx, (frame >> 2) & 1 ? 'flame1' : 'flame2', px2 - 2.5, LH * 0.9 + bob);
    textC('Z CODE 2026', LH - 16, COL.G);
  }

  function drawHowto() {
    drawStars(false);
    textC(T('howtoTitle'), 12, COL.R, 2);
    var y = 44;
    for (var i = 1; i <= 9; i++) {
      textC(T('howto' + i), y, COL.W);
      y += 14;
      if (i === 1) {
        var mx = LW / 2, my = y + 28;
        var order = ['F', 'C', 'R'];
        for (var k = 0; k < order.length; k++) {
          var m = E.MOD[order[k]];
          SPR.draw(ctx, m.spr, mx - m.w / 2, my - m.h);
          my -= m.h;
        }
        SPR.draw(ctx, 'flame1', mx - 2.5, y + 28);
        y += 34;
      }
    }
    if ((frame % 60) < 38) textC(T('pressStart'), Math.round(LH * 0.84), COL.W);
    textC(T('controlsHint'), Math.round(LH * 0.90), COL.D);
  }

  function drawOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, LW, LH);
    textC(T('gameOver'), Math.round(LH * 0.29), COL.R, 2);
    textC(pad6(st.score), Math.round(LH * 0.39), COL.W, 2);
    if (st.newRecord && (frame % 40) < 26) textC(T('newRecord'), Math.round(LH * 0.46), '#f7c948');
    textC('HI ' + pad6(st.hi), Math.round(LH * 0.52), COL.G);
    if ((frame % 60) < 38) textC(T('playAgain'), Math.round(LH * 0.66), COL.W);
  }

  function drawPause() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, LW, LH);
    textC(T('pause'), Math.round(LH * 0.41), COL.W, 2);
    textC(T('resume'), Math.round(LH * 0.49), COL.G);
  }

  function render() {
    ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, LW, LH);
    var warp = st && st.phase === 'bossintro';
    if (screen === 'play' && st) {
      ctx.save();
      if (st.shake > 0) ctx.translate((Math.random() * 4 - 2) | 0, (Math.random() * 4 - 2) | 0);
      drawMoon();
      drawStars(warp);
      drawEnemies();
      drawModule();
      drawBoss();
      drawPlayer();
      drawBullets();
      drawFx();
      ctx.restore();
      if (st.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(0, 0, LW, LH); }
      drawHUD();
      drawBanner();
      drawDockHint();
      if (paused) drawPause();
      if (st.phase === 'gameover' && st.phaseT > 30) drawOver();
    } else if (screen === 'title') {
      drawMoon();
      drawTitle();
    } else if (screen === 'howto') {
      drawHowto();
    }
  }

  // ---------------------------------------------------------------- events
  function drainEvents() {
    for (var i = 0; i < st.events.length; i++) {
      var e = st.events[i];
      SFX.play(e.type, e.data);
    }
    st.events.length = 0;
  }

  // ------------------------------------------------------------------ loop
  var acc = 0, last = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (!last) last = t;
    var dt = Math.min(t - last, 100); last = t;
    frame++;
    if (screen === 'play' && st && !paused) {
      acc += dt;
      while (acc >= 1000 / 60) {
        var inp = {
          left: input.left, right: input.right, up: input.up, down: input.down,
          fire: input.fire, touch: input.touch, tx: input.tx, ty: input.ty
        };
        E.step(st, inp);
        drainEvents();
        acc -= 1000 / 60;
        if (st.phase === 'gameover' && st.phaseT === 1) {
          if (st.hi > hiScore) { hiScore = st.hi; localStorage.setItem('dockstar.hi', String(hiScore)); }
        }
      }
      acc = Math.min(acc, 100);
    } else acc = 0;
    render();
  }

  // ---------------------------------------------------------------- input
  function firePressed() {
    SFX.init();
    SFX.play('ui');
    if (screen === 'title') { startGame(); return; }
    if (screen === 'howto') { screen = 'title'; return; }
    if (screen === 'play') {
      if (paused) { paused = false; return; }
      if (st.phase === 'gameover' && st.phaseT > 60) { startGame(); return; }
    }
  }
  function menuPressed() {
    if (screen === 'howto') { screen = 'title'; return; }
    if (screen === 'play' && st && st.phase === 'gameover' && st.phaseT > 60) {
      screen = 'title'; saveHi();
    }
  }
  function saveHi() {
    if (st && st.hi > hiScore) { hiScore = st.hi; localStorage.setItem('dockstar.hi', String(hiScore)); }
  }

  function toggleFullscreen() {
    SFX.init();
    var d = document;
    if (d.fullscreenElement) { d.exitFullscreen().catch(function () {}); return; }
    var req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
    if (req) {
      var p = req.call(wrap);
      if (p && p.catch) p.catch(function () { maximizeFallback(); });
    } else maximizeFallback();
  }
  function maximizeFallback() {
    // iframe without allowfullscreen: maximize inside the page instead
    document.body.classList.toggle('maxed');
    onResize();
  }

  global.addEventListener('keydown', function (e) {
    var k = e.key;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].indexOf(k) >= 0) e.preventDefault();
    if (e.repeat) return;
    switch (k) {
      case 'ArrowLeft': case 'a': case 'A': case 'q': case 'Q': input.left = 1; break;
      case 'ArrowRight': case 'd': case 'D': input.right = 1; break;
      case 'ArrowUp': case 'w': case 'W': case 'z': case 'Z': input.up = 1; break;
      case 'ArrowDown': case 's': case 'S': input.down = 1; break;
      case ' ': case 'x': case 'X': case 'k': case 'K': input.fire = 1; firePressed(); break;
      case 'Enter': firePressed(); break;
      case 'p': case 'P': if (screen === 'play') { paused = !paused; SFX.play('ui'); } break;
      case 'm': case 'M': toggleMute(); break;
      case 'f': case 'F': toggleFullscreen(); break;
      case 'h': case 'H': if (screen === 'title') { screen = 'howto'; SFX.play('ui'); } break;
      case 't': case 'T': menuPressed(); break;
      case 'Escape': if (document.body.classList.contains('maxed')) { document.body.classList.remove('maxed'); onResize(); } break;
    }
  });
  global.addEventListener('keyup', function (e) {
    switch (e.key) {
      case 'ArrowLeft': case 'a': case 'A': case 'q': case 'Q': input.left = 0; break;
      case 'ArrowRight': case 'd': case 'D': input.right = 0; break;
      case 'ArrowUp': case 'w': case 'W': case 'z': case 'Z': input.up = 0; break;
      case 'ArrowDown': case 's': case 'S': input.down = 0; break;
      case ' ': case 'x': case 'X': case 'k': case 'K': input.fire = 0; break;
    }
  });

  function canvasPos(ev2) {
    var r = canvas.getBoundingClientRect();
    return { x: (ev2.clientX - r.left) * LW / r.width, y: (ev2.clientY - r.top) * LH / r.height };
  }
  function wireCanvas() {
    canvas.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      SFX.init();
      var p = canvasPos(e);
      if (screen === 'title') {
        if (p.x > LW - 72 && p.y < 34) { screen = 'howto'; SFX.play('ui'); return; }
        SFX.play('ui'); startGame(); return;
      }
      if (screen === 'howto') { screen = 'title'; SFX.play('ui'); return; }
      if (screen === 'play') {
        if (paused) { paused = false; SFX.play('ui'); return; }
        if (st.phase === 'gameover' && st.phaseT > 60) {
          if (p.x > LW - 80 && p.y < 40) { screen = 'title'; saveHi(); SFX.play('ui'); }
          else startGame();
          return;
        }
        input.touch = 1; input.tx = p.x; input.ty = p.y;
      }
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!input.touch) return;
      var p = canvasPos(e);
      input.tx = p.x; input.ty = p.y;
    });
    function endTouch() { input.touch = 0; }
    canvas.addEventListener('pointerup', endTouch);
    canvas.addEventListener('pointercancel', endTouch);
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && screen === 'play') paused = true;
  });
  document.addEventListener('fullscreenchange', function () { layout(); });

  // ------------------------------------------------------------ page UI
  function applyLang() {
    document.documentElement.lang = lang;
    el('tagline').textContent = T('tagline');
    el('foot').textContent = T('footer');
    el('btn-fs').textContent = T('fs');
    var btns = document.querySelectorAll('#langs button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', btns[i].getAttribute('data-lang') === lang);
    }
    localStorage.setItem('dockstar.lang', lang);
  }
  var langs = el('langs');
  if (langs) {
    langs.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      lang = b.getAttribute('data-lang');
      SFX.init(); SFX.play('ui');
      applyLang();
    });
  }
  function toggleMute() {
    muted = !muted;
    SFX.setMuted(muted);
    el('btn-sound').textContent = muted ? 'SOUND OFF' : 'SOUND ON';
    el('btn-sound').classList.toggle('off', muted);
    localStorage.setItem('dockstar.mute', muted ? '1' : '0');
  }
  var sndBtn = el('btn-sound');
  if (sndBtn) sndBtn.addEventListener('click', function () { SFX.init(); toggleMute(); });
  var fsBtn = el('btn-fs');
  if (fsBtn) fsBtn.addEventListener('click', toggleFullscreen);

  // ---------------------------------------------------------------- boot
  function boot() {
    canvas = el('game');
    wrap = el('screenwrap');
    mainEl = el('main');
    ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    SPR.build();
    buildFont();
    buildMoon();
    SFX.setMuted(muted);
    el('btn-sound').textContent = muted ? 'SOUND OFF' : 'SOUND ON';
    el('btn-sound').classList.toggle('off', muted);
    applyMode(chooseMode(), false);
    applyLang();
    wireCanvas();
    global.addEventListener('resize', onResize);
    global.addEventListener('orientationchange', onResize);
    if (global.ResizeObserver) new ResizeObserver(onResize).observe(mainEl);
    // read-only introspection hook (QA, screenshots; documented in README)
    global.__dockstar = {
      get st() { return st; },
      get screen() { return screen; },
      get paused() { return paused; },
      get mode() { return { w: LW, h: LH }; },
      start: startGame,
      remode: function () { applyMode(chooseMode(), true); layout(); },
      paint: function () { render(); }
    };
    layout();
    requestAnimationFrame(loop);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
